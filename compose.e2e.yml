services:
  minio-e2e:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: beat-e2e
      MINIO_ROOT_PASSWORD: beat-e2e-secret
    ports:
      - "59002:9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 5s
      retries: 15
    tmpfs:
      - /data
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio-e2e:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set beat http://minio-e2e:9000 beat-e2e beat-e2e-secret &&
        mc mb --ignore-existing beat/beat-agent-e2e
