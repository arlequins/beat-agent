services:
  minio-e2e:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-beat-e2e}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-beat-e2e-secret}
    ports:
      - "59002:9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 5s
      retries: 15
    tmpfs:
      - /data
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio-e2e:
        condition: service_healthy
    environment:
      E2E_BUCKET: ${S3_AGENT_BUCKET:-beat-agent-e2e}
      E2E_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-beat-e2e-secret}
      E2E_USER: ${AWS_ACCESS_KEY_ID:-beat-e2e}
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set beat http://minio-e2e:9000 "$${E2E_USER}" "$${E2E_PASSWORD}" &&
        mc mb --ignore-existing "beat/$${E2E_BUCKET}" &&
        mc stat "beat/$${E2E_BUCKET}"
