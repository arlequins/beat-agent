name: Production deployment

on:
  workflow_dispatch:
    inputs:
      application:
        description: Deployment target
        required: true
        type: choice
        default: all
        options: [all, api, web, batch]

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy-api:
    if: inputs.application == 'all' || inputs.application == 'api'
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      application: api
      github_environment: production
      stage: production
      operation: deploy

  deploy-web:
    needs: deploy-api
    if: >-
      always() &&
      (inputs.application == 'all' || inputs.application == 'web') &&
      (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      application: web
      github_environment: production
      stage: production
      operation: deploy

  deploy-batch:
    needs: deploy-api
    if: >-
      always() &&
      (inputs.application == 'all' || inputs.application == 'batch') &&
      (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      application: batch
      github_environment: production
      stage: production
      operation: deploy
