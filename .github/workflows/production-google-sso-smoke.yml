name: Google SSO production smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      WEB_URL: https://arlequins.github.io/beat-agent/
      BEAT_SSO_SMOKE_ACCESS_TOKEN: ${{ secrets.BEAT_SSO_SMOKE_ACCESS_TOKEN }}
      BEAT_SSO_SMOKE_AUTHORITY: ${{ vars.NEXT_PUBLIC_OIDC_AUTHORITY }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ./tooling/github/setup

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify Beat redirects the Agent to Google SSO
        run: node scripts/google-sso-production-smoke.mjs "$WEB_URL"
